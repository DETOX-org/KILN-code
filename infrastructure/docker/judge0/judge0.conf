# Judge0 CE Configuration
# https://github.com/judge0/judge0

# Server
PORT=2358
RAILS_ENV=production
RAILS_MAX_THREADS=16
MAX_QUEUE_SIZE=100
MAX_CPU_TIME_LIMIT=15.0
MAX_WALL_TIME_LIMIT=30.0
MAX_MEMORY_LIMIT=524288
MAX_STACK_LIMIT=131072
MAX_MAX_PROCESSES_AND_OR_THREADS=120
MAX_ENABLE_PER_PROCESS_AND_THREAD_TIME_LIMIT=false
MAX_MAX_FILE_SIZE=4096
MAX_NUMBER_OF_RUNS=1

# Isolate Sandbox & Host Resource Settings
ENABLE_ISOLATE=true
BOX_COUNT=1000
ISOLATE_BOX_INITIAL_ID=0
MAINTENANCE_MODE=false

# Cleanup and Sandbox Security
CLEANUP_AFTER_RUN=true
DROP_NETWORK=true
ALLOW_UNTRUSTED_ROOT=false

# Pinned Languages
ENABLE_DEFAULT_SUBMISSION_CALLBACK=false
