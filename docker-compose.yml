services:
  api:
    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "2000:3000"

    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://kiln:kiln_dev_password@db:5432/kiln
      # The backend never imports judge engine code directly — it talks
      # to the `judge` service below over HTTP. Service name resolves on
      # the compose network; override for a split deployment (e.g. a VPS).
      JUDGE_SERVICE_URL: http://judge:3001

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      judge:
        condition: service_started

  judge:
    build:
      context: .
      dockerfile: infrastructure/docker/judge/Dockerfile

    # 3001 is the judge HTTP API the `api` service calls (service-to-service
    # over the compose network — no need to publish it to the host/internet).
    expose:
      - "3001"
      - "3002"
      - "9999"

    environment:
      REDIS_URL: redis://redis:6379
      JUDGE0_URL: http://host.docker.internal:2358
      DMOJ_PROBLEM_ROOT: /dmoj-problems

    # On Linux (including any VPS), unlike Docker Desktop on Mac/Windows,
    # host.docker.internal is not resolvable by default — this makes it
    # point at the host gateway so JUDGE0_URL above actually works.
    extra_hosts:
      - "host.docker.internal:host-gateway"

    volumes:
      - dmoj_problems:/dmoj-problems

    depends_on:
      redis:
        condition: service_healthy

  dmoj:
    build:
      context: .
      dockerfile: infrastructure/docker/judge/dmoj/Dockerfile

    command: ["run", "judge", "-p", "9999", "-c", "/config/judge.yml"]

    environment:
      DMOJ_JUDGE_NAME: kiln-dmoj-judge
      DMOJ_JUDGE_KEY: kiln-dmoj-key

    volumes:
      - ./infrastructure/docker/judge/dmoj/config:/config:ro
      - ./infrastructure/docker/judge/dmoj/problems:/problems:ro
      - dmoj_problems:/dmoj-problems

    depends_on:
      - judge

  piston:
    image: ghcr.io/engineer-man/piston@sha256:2f66b7456189c4d713aa986d98eccd0b6ee16d26c7ec5f21b30e942756fd127a

    privileged: true

    environment:
      PISTON_LIMIT_OVERRIDES: '{"kotlin":{"compile_cpu_time":30000}}'

    volumes:
      - piston_data:/piston

    ports:
      - "2001:2000"

  redis:
    image: redis:7-alpine

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    command: redis-server --appendonly yes

    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  db:
    image: postgres:18-alpine

    restart: unless-stopped

    environment:
      POSTGRES_DB: kiln
      POSTGRES_USER: kiln
      POSTGRES_PASSWORD: kiln_dev_password

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U kiln -d kiln" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  piston_data:
  postgres_data:
  redis_data:
  dmoj_problems: